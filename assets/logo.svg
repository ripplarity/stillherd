<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Stillherd">
  <title>Stillherd</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1B6E"/><stop offset=".55" stop-color="#14306B"/><stop offset="1" stop-color="#0B4A55"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#3EF2C0" stop-opacity=".35"/><stop offset="1" stop-color="#3EF2C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/><stop offset=".5" stop-color="#FF6FB5"/><stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DFFD4"/><stop offset="1" stop-color="#1FC98A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect width="256" height="256" rx="60" fill="url(#glow)"/>
  <!-- the pen -->
  <path d="M52 190 V116 L128 62 L204 116 V190 Z" fill="#FFFFFF" fill-opacity=".06" stroke="url(#barn)" stroke-width="16" stroke-linejoin="round" filter="url(#soft)"/>
  <!-- prompt, then the herd held still (pause) -->
  <path d="M80 128 L100 146 L80 164" fill="none" stroke="url(#mint)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="116" y="124" width="20" height="44" rx="6" fill="#7DFFD4"/>
  <rect x="146" y="124" width="20" height="44" rx="6" fill="#8B7CFF"/>
  <!-- the signed receipt -->
  <circle cx="192" cy="64" r="30" fill="url(#mint)" stroke="#0E2350" stroke-width="5"/>
  <path d="M178 64 L188 74 L207 54" fill="none" stroke="#0E2350" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
